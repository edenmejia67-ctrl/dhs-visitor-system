async function ntfyPost(topic,title,msg){
 try{const r=await fetch(`${NTFY}/${encodeURIComponent(topic)}`,{method:"POST",headers:{Title:title,Priority:"5"},body:msg});
  return r.ok?{s:"accepted"}:{s:"failed",err:`HTTP ${r.status}${r.status===429?" (rate limited, wait and retry)":""}`}}
 catch(e){return{s:"failed",err:navigator.onLine?"No response: network, ad blocker, or wrong server URL":"This device is offline"}}}
async function fire(id){const v=DB.vis.find(x=>x.id===id);if(!v)return{s:"failed",err:"Record not found"};const f=findF(v.facId);
 const r=f&&f.topic?await ntfyPost(f.topic,"DHS Visitor Alert",`Visitor: ${v.name}\nPurpose: ${purTxt(v,1)}\nFor: ${v.person}\nArrived: ${ft(v.tin)} (Asia/Manila)`):{s:"notopic"};
 v.ntfy={s:r.s,err:r.err||null,at:iso()};
 await sb.from("visitors").update({ntfy_status:r.s,ntfy_error:r.err||null,ntfy_at:v.ntfy.at}).eq("id",id);return r}

 const csv="\ufeff"+[["Date","Name","Contact","Purpose","Person to visit","Time in","Time out"].map(c).join(","),...rows].join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`dhs-visitors-${ymd(Date.now())}.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(`Exported ${rows.length} records.`)}

async function boot(){
 const bad=!CFG.url||!CFG.key||/YOUR[-_]/i.test(CFG.url+CFG.key);
 if(bad)return notReady("Open <code>site/config.js</code> in the repository and paste your Supabase Project URL and publishable key, then commit.");
 let role="";try{role=JSON.parse(atob(CFG.key.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).role}catch(x){}
 if(role==="service_role"||/^sb_secret_/.test(CFG.key))return notReady("<b>config.js contains a SECRET key.</b> Remove it now, commit, and rotate that key in Supabase. Only the publishable (or anon) key belongs here.");
 if(!window.supabase)return notReady("The Supabase library did not load. Check the internet connection and reload.");
 sb=sb||supabase.createClient(CFG.url,CFG.key);const{data:{session}}=await sb.auth.getSession();
 if(!session){S.user=null;render();return}
 try{const p=await sb.from("profiles").select("role,display_name").eq("id",session.user.id).single();
  if(p.error||!p.data)throw new Error("This account has no role yet. Ask the administrator to finish setting it up.");
  S.user={role:p.data.role,name:p.data.display_name||session.user.email,uid:session.user.id};await loadAll();
  if(S.user.role==="teacher"){const f=DB.fac.find(x=>x.pid===S.user.uid);if(!f)throw new Error("No faculty record is linked to this account yet. Ask the administrator.");S.user.id=f.id}
  subscribe();render()}
 catch(e){const m=e.message||"Could not load data";await sb.auth.signOut();S.user=null;render();$("#err").textContent=m}}

 $("#mo").innerHTML=`<div class="ov" onclick="closeM()"><div class="md wide" onclick="event.stopPropagation()"><h2>${id?"Edit":"Add"} faculty or office</h2><div><label>Display name</label><input id="ef_n" value="${esc(f.name)}" maxlength="120" placeholder="e.g. Ms. Lourdes Dela Peña (Teacher)"></div><div><label>Type</label><select id="ef_k"><option value="teacher" ${f.kind==="teacher"?"selected":""}>Teacher</option><option value="office" ${f.kind==="office"?"selected":""}>Office</option></select></div>
 <div><label>ntfy topic (must be unique per teacher)</label><div style="display:flex;gap:8px"><input id="ef_t" value="${esc(f.topic)}" placeholder="letters, numbers, - and _"><button type="button" class="btn ghost" onclick="$('#ef_t').value=mkTopic()">Generate</button></div></div>
 <div class="err" id="ferr"></div><div class="row"><button type="button" class="btn" onclick="saveF(${id})">Save</button><button type="button" class="btn ghost" onclick="closeM()">Cancel</button></div></div></div>`}
async function saveF(id){const g=x=>$("#ef_"+x).value.trim(),n=g("n"),k=g("k"),tp=g("t"),e=m=>{$("#ferr").textContent=m};
 if(!n)return e("Enter a display name.");if(tp&&!/^[A-Za-z0-9_-]{1,64}$/.test(tp))return e("Topic: 1 to 64 letters, numbers, - or _ only.");
 if(tp&&DB.fac.some(x=>x.id!==id&&x.topic===tp))return e("Each teacher needs a different topic. This one is already assigned.");
 const row={name:n,kind:k,ntfy_topic:tp||null};e("Saving…");
 const r=id?await sb.from("faculty").update(row).eq("id",id):await sb.from("faculty").insert(row);
 if(r.error)return e(r.error.code==="23505"?"That topic is already assigned to someone else.":r.error.message);
 closeM();await refresh();toast("Saved.")}
async function delF(id){if(!confirm("Remove this faculty record? Past visitor records are kept."))return;
 const r=await sb.from("faculty").delete().eq("id",id);if(r.error)return toast("Could not remove: "+r.error.message);await refresh();toast("Removed.")}
function copyT(id){const f=findF(id);f&&f.topic?copy(f.topic):toast("Topic not configured.")}
async function testF(id){const f=findF(id);if(!f)return;if(!f.topic)return toast("Topic not configured. Add a topic first.");toast("Sending test…");
 const r=await ntfyPost(f.topic,"DHS Visitor Alert (TEST)",`TEST for ${f.name}. Sent ${ft(iso())} (Asia/Manila).`);
 toast(r.s==="accepted"?"ntfy accepted the test. Check the subscribed phone.":"Test failed: "+r.err)}
async function changePw(){const p=$("#npw").value,e=m=>{$("#perr").textContent=m};if(p.length<8)return e("At least 8 characters.");const r=await sb.auth.updateUser({password:p});if(r.error)return e(r.error.message);$("#npw").value="";e("");toast("Password changed.")}
function setL(l){LANG=l;sv("dhs_lang",l);render()}
boot();
</script></body></html>
